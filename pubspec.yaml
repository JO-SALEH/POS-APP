name: jo_pos_mobile
description: JØ PHARMA MOBILE - offline pharmacy point of sale, the mobile companion of JØ PHARMA.
publish_to: 'none'
version: 2.1.0+3

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  path: ^1.9.0
  mobile_scanner: ^7.4.2   # 7.x: Android 15/16 (16 KB pages) support, black-screen + CameraX init fixes
  http: ^1.2.1
  share_plus: ^10.1.4   # 10.x keeps Share.shareXFiles and uses web ^1 (needed by mobile_scanner 7)
  file_picker: ^8.0.6
  crypto: ^3.0.3
  path_provider: ^2.1.3
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/bg.jpg
