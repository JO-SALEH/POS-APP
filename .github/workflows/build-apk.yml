name: Build JO POS APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write   # lets the job publish the APK as a GitHub Release
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: flutter pub get
      - name: Barcode / import tests
        run: flutter test test_importer
  apk:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android project + patch
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          flutter create --platforms=android --project-name jo_pos_mobile --org com.joroyalty .
          mv pubspec.yaml.bak pubspec.yaml
          rm -rf test
          python3 tools/patch_android.py
      - name: Force all plugins to compile against Android SDK 36
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/compilesdk.gradle <<'GRADLE'
          allprojects { p ->
            p.afterEvaluate {
              if (p.hasProperty('android')) {
                p.android.compileSdk = 36
              }
            }
          }
          GRADLE
      - run: flutter pub get
      - name: Build release APK (retries on network errors)
        run: |
          for i in 1 2 3; do
            flutter build apk --release && exit 0
            echo "Build attempt $i failed, retrying in 20s..."
            sleep 20
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: JO_POS_apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publish APK as a release (stable download link)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk JO_POS.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest JO_POS.apk --target "${{ github.sha }}" \
            --title "JO POS - latest build" \
            --notes "Latest APK built from main (${{ github.sha }}). Download JO_POS.apk below and install it on the phone."
