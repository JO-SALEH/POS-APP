name: Build JO POS APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android project + patch
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          flutter create --platforms=android --project-name jo_pos_mobile --org com.joroyalty .
          mv pubspec.yaml.bak pubspec.yaml
          rm -rf test
          python3 tools/patch_android.py
      - name: Force all plugins to compile against Android SDK 36
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/compilesdk.gradle <<'GRADLE'
          allprojects { p ->
            p.afterEvaluate {
              if (p.hasProperty('android')) {
                p.android.compileSdk = 36
              }
            }
          }
          GRADLE
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: JO_POS_apk
          path: build/app/outputs/flutter-apk/app-release.apk
